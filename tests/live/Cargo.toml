[package]
name = "fishmuse-live-tests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[test]]
name = "deepseek_live"
path = "deepseek_live.rs"

[[test]]
name = "foobar_live"
path = "foobar_live.rs"

[dependencies]
fishmuse-ai = { path = "../../crates/fishmuse-ai" }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
