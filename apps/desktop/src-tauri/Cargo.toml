[package]
name = "fishmuse-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "=2.5.5", features = [] }

[dependencies]
async-trait = "0.1"
base64 = "0.22"
fishmuse-ai = { path = "../../../crates/fishmuse-ai" }
fishmuse-domain = { path = "../../../crates/fishmuse-domain" }
fishmuse-library = { path = "../../../crates/fishmuse-library" }
fishmuse-playback = { path = "../../../crates/fishmuse-playback" }
fishmuse-storage = { path = "../../../crates/fishmuse-storage" }
futures-util = "0.3"
rfd = "0.15"
secrecy = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
sha2 = "0.10"
tauri = { version = "=2.10.2", features = [] }
tauri-plugin-wdio = { version = "1.4.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.4.0", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-util = "0.7"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
