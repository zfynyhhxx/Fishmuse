[package]
name = "fishmuse-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
async-trait = "0.1"
fishmuse-ai = { path = "../../../crates/fishmuse-ai" }
fishmuse-domain = { path = "../../../crates/fishmuse-domain" }
fishmuse-library = { path = "../../../crates/fishmuse-library" }
fishmuse-playback = { path = "../../../crates/fishmuse-playback" }
fishmuse-storage = { path = "../../../crates/fishmuse-storage" }
futures-util = "0.3"
rfd = "0.15"
secrecy = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
sha2 = "0.10"
tauri = { version = "2.9.5", features = [] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
